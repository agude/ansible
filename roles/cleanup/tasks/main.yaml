---
# Enable the empty-downloads systemd user service.
# The service file is deployed by dotfiles — this just activates it.
# Enable only, never start: the service is a oneshot that is inactive once it
# has run, so `state: started` would empty ~/Downloads on every playbook run.

- name: Reload systemd user daemon
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ user }}"

- name: Enable empty-downloads service
  ansible.builtin.systemd:
    name: empty-downloads.service
    enabled: true
    scope: user
  become: true
  become_user: "{{ user }}"
