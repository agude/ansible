---
- name: Install Codex CLI  # noqa: command-instead-of-module risky-shell-pipe
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://chatgpt.com/codex/install.sh | sh
    creates: "/home/{{ user }}/.local/bin/codex"
    executable: /bin/bash
  # The installer prompts on /dev/tty ("Start Codex now?"), and Ansible's
  # SSH session has a tty, so without CODEX_NON_INTERACTIVE the task hangs
  # forever. It also appends a PATH block to ~/.zshrc (a symlink into the
  # dotfiles repo) unless ~/.local/bin is already on PATH.
  environment:
    CODEX_NON_INTERACTIVE: "1"
    PATH: "/home/{{ user }}/.local/bin:{{ ansible_facts.env.PATH }}"
  become: true
  become_user: "{{ user }}"

# Ubuntu restricts unprivileged user namespaces through AppArmor, and the
# profile lets bwrap (Codex's sandbox) create them. Kernels without that
# restriction do not need it, and on kaon (AppArmor disabled in the Pi
# kernel) apparmor_parser fails to load it.
- name: Check for AppArmor user namespace restriction
  ansible.builtin.stat:
    path: /proc/sys/kernel/apparmor_restrict_unprivileged_userns
  register: codex_userns_restriction

- name: Install bwrap AppArmor profile
  ansible.builtin.copy:
    src: bwrap-apparmor
    dest: /etc/apparmor.d/bwrap
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: codex_reload_bwrap_apparmor
  when: codex_userns_restriction.stat.exists

- name: Remove bwrap AppArmor profile where it is not needed
  ansible.builtin.file:
    path: /etc/apparmor.d/bwrap
    state: absent
  become: true
  when: not codex_userns_restriction.stat.exists
