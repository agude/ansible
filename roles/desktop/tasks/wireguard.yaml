---
- name: Install WireGuard
  ansible.builtin.apt:
    name:
      - wireguard
      - wireguard-tools
    state: present
  become: true

- name: Find NM-generated WireGuard netplan files
  ansible.builtin.find:
    paths: /etc/netplan
    patterns: "90-NM-*"
    file_type: file
  register: nm_netplan_files
  become: true

- name: Check for wg0 in NM-generated files
  ansible.builtin.shell:
    cmd: grep -l 'wg0' {{ item.path }} 2>/dev/null || true
  loop: "{{ nm_netplan_files.files }}"
  register: wg_netplan_check
  changed_when: false
  become: true

- name: Remove NM-generated WireGuard netplan files
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: absent
  loop: "{{ wg_netplan_check.results }}"
  when: item.stdout != ""
  become: true
  notify: Apply netplan

- name: Deploy WireGuard netplan config
  ansible.builtin.template:
    src: wireguard-netplan.yaml.j2
    dest: /etc/netplan/60-wireguard.yaml
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
  notify: Apply netplan
