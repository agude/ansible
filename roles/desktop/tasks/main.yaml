---
- name: Check for NVIDIA GPU
  ansible.builtin.shell:
    cmd: set -o pipefail && lspci | grep -qi nvidia
    executable: /bin/bash
  register: desktop_nvidia_check
  changed_when: false
  failed_when: false

- name: Install NVIDIA drivers
  ansible.builtin.import_tasks: nvidia.yaml
  when: desktop_nvidia_check.rc == 0

- name: Install Firefox from Mozilla deb repo
  ansible.builtin.import_tasks: firefox.yaml

- name: Accept Microsoft fonts EULA
  ansible.builtin.debconf:
    name: ttf-mscorefonts-installer
    question: msttcorefonts/accepted-mscorefonts-eula
    value: "true"
    vtype: boolean
  become: true

- name: Install desktop packages
  ansible.builtin.apt:
    name: "{{ desktop_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Configure NAS mounts
  ansible.builtin.import_tasks: nas.yaml
  tags: [nas]

- name: Configure WireGuard VPN
  ansible.builtin.import_tasks: wireguard.yaml
  when: wireguard_private_key is defined
