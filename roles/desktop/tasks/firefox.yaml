---
# Firefox snap on Ubuntu has broken font rendering due to sandbox restrictions.
# Install from Mozilla's official deb repo instead.

- name: Remove Firefox snap
  community.general.snap:
    name: firefox
    state: absent
  become: true

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Download Mozilla APT signing key
  ansible.builtin.get_url:
    url: https://packages.mozilla.org/apt/repo-signing-key.gpg
    dest: /etc/apt/keyrings/packages.mozilla.org.asc
    mode: "0644"
  become: true

- name: Remove deb822 mozilla.sources file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/mozilla.sources
    state: absent
  become: true

- name: Clear stale Mozilla apt cache
  ansible.builtin.shell:
    cmd: rm -f /var/lib/apt/lists/packages.mozilla.org_apt_*
  become: true
  changed_when: false

- name: Add Mozilla APT repository
  # arch=amd64 skips binary-all index which returns HTTP 400 (Mozilla server bug)
  # deb822 Architectures: field does not have the same effect
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main"
    filename: mozilla
    state: present
  become: true

- name: Pin Mozilla repo and block Ubuntu's snap transitional package
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/mozilla
    content: |
      Package: *
      Pin: origin packages.mozilla.org
      Pin-Priority: 1000

      Package: firefox*
      Pin: release o=Ubuntu
      Pin-Priority: -1
    mode: "0644"
  become: true

- name: Install Firefox from Mozilla repo
  ansible.builtin.apt:
    name: firefox
    state: present
    update_cache: true
  become: true
