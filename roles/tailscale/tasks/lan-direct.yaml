---
- name: Install home LAN detection tools
  ansible.builtin.apt:
    name:
      - iproute2
      - iputils-arping
      - network-manager
    state: present
  become: true

- name: Install home LAN routing helper
  ansible.builtin.copy:
    src: tailscale-lan-direct.py
    dest: /usr/local/sbin/tailscale-lan-direct
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install home LAN identity
  ansible.builtin.template:
    src: tailscale-lan-direct.json.j2
    dest: /etc/tailscale-lan-direct.json
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Check for an existing home LAN routing service
  ansible.builtin.stat:
    path: /etc/systemd/system/tailscale-lan-direct.service
  register: tailscale_lan_direct_existing_service

- name: Install home LAN routing rule service
  ansible.builtin.template:
    src: tailscale-lan-direct.service.j2
    dest: /etc/systemd/system/tailscale-lan-direct.service
    owner: root
    group: root
    mode: "0644"
  register: tailscale_lan_direct_service
  become: true

- name: Install home LAN network change hook
  ansible.builtin.copy:
    src: 90-tailscale-lan-direct
    dest: /etc/NetworkManager/dispatcher.d/90-tailscale-lan-direct
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Enable home LAN routing rule service
  ansible.builtin.systemd_service:
    name: tailscale-lan-direct.service
    enabled: true
    state: started
    daemon_reload: "{{ tailscale_lan_direct_service.changed }}"
  when: not ansible_check_mode or tailscale_lan_direct_existing_service.stat.exists
  become: true

# Reconcile even when the oneshot is already active, including migration from
# its old permanent rule. Check mode has not installed the helper or config.
- name: Reconcile home LAN routing rule
  ansible.builtin.command: /usr/local/sbin/tailscale-lan-direct
  register: tailscale_lan_direct_result
  changed_when: tailscale_lan_direct_result.stdout == 'changed'
  when: not ansible_check_mode
  become: true
