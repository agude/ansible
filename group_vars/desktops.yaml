---
dotfiles_profile: default

# Interpreter discovery takes the first python3.X on PATH, which can be a uv
# or other user-installed Python. Modules such as apt need the system one.
ansible_python_interpreter: /usr/bin/python3

nas_ip: 192.168.1.10
desktop_nas_mounts:
  - src: "//{{ nas_ip }}/homes/{{ user }}"
    path: "/home/{{ user }}/synology"
  - src: "//{{ nas_ip }}/homes/{{ user }}/Documents"
    path: "/home/{{ user }}/Documents"
  - src: "//{{ nas_ip }}/backups"
    path: /mnt/synology/backups
  - src: "//{{ nas_ip }}/media"
    path: /mnt/synology/media
  - src: "//{{ nas_ip }}/games"
    path: /mnt/synology/games

smb_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          65373666633634306633616234653262373735653734656561666665353963653735643362643762
          3132393936333537323236623532636565653837623665640a663436376631343861316337613063
          31663138313535383830363935396236303764326563333034663636366663386438343766626464
          6431393965643363310a316234356338363932386233313562363839663733386137643335393438
          63636632633139326638643037343033303366306364313632376537343565303563

ssh_outbound_targets:
  - dirac
  - einstein
  - kaon
  - synology
  - github

czkawka_version: "11.0.1"

# Tailscale client. Enable per host: einstein stays on the home LAN, so it is
# already reachable through kaon's subnet route.
tailscale_enabled: false

desktop_packages:
  - bats
  - libimage-exiftool-perl
  - ttf-mscorefonts-installer
  - build-essential
  - cmake
  - gimp
  - gparted
  - inkscape
  - latexmk
  - pandoc
  - tesseract-ocr
  - texlive-fonts-recommended
  - texlive-latex-base
  - texlive-latex-extra
  - texlive-pictures
  - texlive-science
  - xclip
