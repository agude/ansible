---
name: Lint
on:
  push:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install dependencies
        run: just sync

      # Must match vault_password_file in ansible.cfg and the actual vault
      # password.
      - name: Create vault password file
        run: echo "$VAULT_PASSWORD" > .vault_pass.txt
        env:
          VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}

      - name: Lint and syntax check
        run: just check

      - name: Remove vault password file
        if: always()
        run: rm -f .vault_pass.txt
